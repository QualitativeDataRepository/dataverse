<ui:composition xmlns="http://www.w3.org/1999/xhtml"
     xmlns:h="http://java.sun.com/jsf/html"
     xmlns:f="http://java.sun.com/jsf/core"
     xmlns:ui="http://java.sun.com/jsf/facelets"
     xmlns:p="http://primefaces.org/ui">
    
    <div class="row mb-3">
        <label class="col-sm-3 form-label">
            #{bundle['user.acccountterms']} <span class="bi bi-asterisk text-danger" title="#{bundle.requiredField}"/>
            <span class="bi bi-question-circle tooltip-icon"
                  data-bs-toggle="tooltip" data-bs-placement="right" title="#{bundle['user.acccountterms.tip']}"></span>
        </label>
        <div class="col-sm-9">
            <div class="well terms-agreement-block">
                <h:outputText value="#{systemConfig.applicationTermsOfUse}" escape="false"/>
            </div>
            <div class="checkbox">
              <p:selectBooleanCheckbox id="terms" required="true" 
                                       requiredMessage="#{bundle['user.acccountterms.required']}"
                                       itemLabel="#{bundle['user.acccountterms.iagree']}">
                <f:validator validatorId="requiredCheckboxValidator"/>
              </p:selectBooleanCheckbox>
              <p:message for="terms" display="text" />
            </div>
        </div>
    </div>
</ui:composition>
