<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:o="http://omnifaces.org/ui"
                xmlns:jsf="jakarta.faces"
                xmlns:iqbs="jakarta.faces.composite/iqbs">

    <!--The p:dialog for this lives in dataset & file -->
    <div jsf:id="packagePopupDownloadInfo">
        <div class="col-sm-12">
            <p class="form-text no-margin-top">                                           
                <h:outputFormat value="#{bundle['packageDownload.instructions']}" escape="false">
                    <f:param value="#{systemConfig.guidesBaseUrl}"/>
                    <f:param value="#{systemConfig.guidesVersion}"/>
                </h:outputFormat>
            </p>
        </div>
        <div class="col-sm-12 margin-bottom">
            <ui:include src="file-info-fragment.xhtml">
                <ui:param name="fileMetadata" value="#{packagePopupFragmentBean.fileMetadata}" />
            </ui:include>
        </div>
        <div class="col-sm-12">
            <label>#{bundle['packageDownload.urlHeader']}</label> 
            <p><code>#{systemConfig.getDataverseSiteUrl()}/api/access/datafile/#{packagePopupFragmentBean.fileMetadata.dataFile.id}</code></p>
        </div>
        <div class="col-sm-12 button-block margin-top">              
            <p:commandButton styleClass="btn btn-secondary" id="downloadPackagePopupCancelButton" value="#{bundle.close}" update="downloadPackagePopup" onclick="PF('downloadPackagePopup').hide();" immediate="true"/>
        </div>
    </div>
</ui:composition>
