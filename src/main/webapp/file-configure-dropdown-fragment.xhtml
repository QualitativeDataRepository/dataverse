<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:c="jakarta.tags.core"
    xmlns:jsf="jakarta.faces"
    xmlns:pt="jakarta.faces.passthrough"
    xmlns:cc="jakarta.faces.composite"
    xmlns:o="http://omnifaces.org/ui"
    xmlns:iqbs="jakarta.faces.composite/iqbs">
        
        <!-- Configure Options -->
        <li class="dropdown-header">#{bundle['file.optionsBtn.header.configure']} <span class="bi bi-gear"/></li>
        <ui:repeat value="#{configureTools}" var="tool">
            <li>
                <p:commandLink styleClass="dropdown-item" update="@([id$=configureToolPopup])"
                                action="#{configureFragmentBean.setConfigurePopupTool(tool)}"
                                oncomplete="PF('configureToolPopup').show()">
                        <f:actionListener binding="#{configureFragmentBean.setConfigureIds(fileId,fileMetadata.id)}"/>
                        #{tool.displayName}
                </p:commandLink>
            </li>
        </ui:repeat>
        <!-- END: Configure Options -->

</ui:composition>
