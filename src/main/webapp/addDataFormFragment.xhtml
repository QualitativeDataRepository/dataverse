<ui:composition xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:c="jakarta.tags.core"
    xmlns:p="http://primefaces.org/ui"
    xmlns:jsf="jakarta.faces">
    <!-- Add Data Form - not logged in... -->
    <p:dialog id="addDataGuest" header="#{bundle['dataverse.results.dialog.addDataGuest.header']}" widgetVar="addData_popup" modal="true">
        <p class="form-text">
            <h:outputText value="#{dataverseHeaderFragment.signupAllowed ? bundle['dataverse.results.dialog.addDataGuest.msg.signup'] : bundle['dataverse.results.dialog.addDataGuest.msg']}" escape="false"></h:outputText>
        </p>
        <div class="button-block">
            <ui:fragment rendered="#{dataverseHeaderFragment.signupAllowed}">
                <a class="btn btn-secondary" href="#{settingsWrapper.get(':QDRDrupalSiteURL')}/user/register" title="#{bundle['dataverse.results.dialog.addDataGuest.signup.title']}">#{bundle['signup']}</a>
            </ui:fragment>
            <a class="btn btn-secondary" href="#{dataverseHeaderFragment.getSignupUrl(navigationWrapper.getSSOLoginPath())}" title="#{bundle['dataverse.results.dialog.addDataGuest.login.title']}">#{bundle['login']}</a>
        </div>
    </p:dialog>
</ui:composition>
