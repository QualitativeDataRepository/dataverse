<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core"
                xmlns:p="http://primefaces.org/ui"
                xmlns:o="http://omnifaces.org/ui"
                xmlns:jsf="jakarta.faces"
                xmlns:iqbs="jakarta.faces.composite/iqbs">

        <p class="form-text">
            <h:outputText styleClass="text-start" value=" #{configureFragmentBean.configurePopupTool.getDescriptionLang()}&lt;br/&gt;#{configureFragmentBean.getMessageApi()}" escape="false"/>
        </p>
        
        <div class="button-block">
            <p:commandButton styleClass="btn btn-secondary" value="#{bundle['continue']}"
                action="#{configureFragmentBean.configureExternalAlert()}" 
                onclick="PF('configureToolPopup').hide();"
                update=":messagePanel">
            </p:commandButton>
            <button class="btn btn-link" onclick="PF('configureToolPopup').hide();PF('blockDatasetForm').hide();" type="button">
                #{bundle.cancel}
            </button>
        </div>
</ui:composition>
