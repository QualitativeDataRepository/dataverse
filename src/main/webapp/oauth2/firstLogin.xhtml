<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:jsf="jakarta.faces"
      xmlns:o="http://omnifaces.org/ui"
      xmlns:of="http://omnifaces.org/functions">
    <h:head>
    </h:head>

    <h:body>
        <f:metadata>
            <f:viewAction action="#{OAuth2FirstLoginPage.init()}"/>
        </f:metadata>
        <ui:composition template="/dataverse_template.xhtml">
            <ui:param name="pageTitle" value="#{bundle.account} - #{dataverseServiceBean.findRootDataverse().name}"/>
            <ui:param name="showDataverseHeader" value="false"/>
            <ui:param name="showMessagePanel" value="#{true}"/>
            <ui:define name="body">
                <div class="row">
                    <div class="col-md-12">
                        <h1>
                            <h:outputText value="#{OAuth2FirstLoginPage.welcomeMessage}"/>
                        </h1>
                    </div>
                </div>

                <p:tabView id="tabView">
                    <p:tab id="newAccountTab" title="#{bundle['account.info']}">
                        <p class="form-text">
                            #{OAuth2FirstLoginPage.createFromWhereTip}
                        </p>
                        <h:form id="newAccountForm">
                            <p:focus context="newAccountForm"/>
                            <div class="row mb-3">
                                <label
                                        for="username"
                                        class="col-sm-3 form-label"
                                        aria-describedby="usernameHelpText">
                                    #{bundle['user.username']} 
                                    <span class="bi bi-asterisk text-danger" title="#{bundle.requiredField}"/>
                                    <span id="usernameHelpText" class="visually-hidden">
                                        #{bundle['user.username.illegal.tip']}
                                    </span>
                                    <span class="bi bi-question-circle tooltip-icon"
                                          aria-hidden="true"
                                          data-bs-toggle="tooltip" data-bs-placement="right" title="#{bundle['user.username.illegal.tip']}"></span>
                                </label>
                                <div class="col-sm-4">
                                    <p:inputText id="username" styleClass="form-control" value="#{OAuth2FirstLoginPage.username}" validator="#{OAuth2FirstLoginPage.validateUserName}"/>
                                    <p:message for="username" display="text"/>
                                </div>
                                <div class="offset-sm-3 col-sm-9" jsf:rendered="#{OAuth2FirstLoginPage.convertFromBuiltinIsPossible}">
                                    <p class="form-text">
                                        <h:outputText value="#{OAuth2FirstLoginPage.suggestConvertInsteadOfCreate}" escape="false"/>
                                    </p>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label
                                        for="givenName"
                                        class="col-sm-3 form-label"
                                        aria-describedby="givenNameHelpText">
                                    #{bundle['user.firstName']} 
                                    <span class="bi bi-asterisk text-danger" title="#{bundle.requiredField}"/>
                                    <span id="givenNameHelpText" class="visually-hidden">
                                        #{bundle['user.firstName.tip']}
                                    </span>
                                    <span class="bi bi-question-circle tooltip-icon"
                                          aria-hidden="true"
                                          data-bs-toggle="tooltip" data-bs-placement="right" title="#{bundle['user.firstName.tip']}"></span>
                                </label>
                                <div class="col-sm-4">
                                    <p:inputText id="givenName" styleClass="form-control" value="#{OAuth2FirstLoginPage.newUser.displayInfo.firstName}"/>
                                    <p:message for="givenName" display="text"/>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label
                                        for="familyName"
                                        class="col-sm-3 form-label"
                                        aria-describedby="familyNameHelpText">
                                    #{bundle['user.lastName']} 
                                    <span class="bi bi-asterisk text-danger" title="#{bundle.requiredField}"/>
                                    <span id="familyNameHelpText" class="visually-hidden">
                                        #{bundle['user.lastName.tip']}
                                    </span>
                                    <span class="bi bi-question-circle tooltip-icon"
                                          aria-hidden="true"
                                          data-bs-toggle="tooltip" data-bs-placement="right" title="#{bundle['user.lastName.tip']}"></span>
                                </label>
                                <div class="col-sm-4">
                                    <p:inputText id="familyName" styleClass="form-control" value="#{OAuth2FirstLoginPage.newUser.displayInfo.lastName}"/>
                                    <p:message for="familyName" display="text"/>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label
                                        for="selectedEmail"
                                        class="col-sm-3 form-label"
                                        aria-describedby="selectedEmailHelpText">
                                    #{bundle['email']} 
                                    <span class="bi bi-asterisk text-danger" title="#{bundle.requiredField}"/>
                                    <span id="selectedEmailHelpText" class="visually-hidden">
                                        #{bundle['user.email.tip']}
                                    </span>
                                    <span class="bi bi-question-circle tooltip-icon"
                                          aria-hidden="true"
                                          data-bs-toggle="tooltip" data-bs-placement="right" title="#{bundle['user.email.tip']}"></span>
                                </label>
                                <div class="col-sm-4" jsf:rendered="#{OAuth2FirstLoginPage.getEmailsToPickFrom().size() lt 2}">
                                    <p:inputText id="selectedEmailZeroOrOneToPickFrom" styleClass="form-control" value="#{OAuth2FirstLoginPage.selectedEmail}" validator="#{OAuth2FirstLoginPage.validateUserEmail}"/>
                                    <p:message for="selectedEmailZeroOrOneToPickFrom" display="text"/>
                                </div>
                                <div class="col-sm-4" jsf:rendered="#{OAuth2FirstLoginPage.getEmailsToPickFrom().size() gt 1}">
                                    <p:autoComplete id="selectedEmailMoreThanOneToPickFrom" 
                                                    dropdown="true" scrollHeight="180" style="width:100%;"
                                                    minQueryLength="2" queryDelay="1000"
                                                    value="#{OAuth2FirstLoginPage.selectedEmail}" 
                                                    completeMethod="#{OAuth2FirstLoginPage.getEmailsToPickFrom()}" 
                                                    validator="#{OAuth2FirstLoginPage.validateUserEmail}" />
                                    <p:message for="selectedEmailMoreThanOneToPickFrom" display="text"/>
                                </div>
                            </div>
                            <div class="row mb-3" jsf:rendered="#{OAuth2FirstLoginPage.newUser.displayInfo.orcid != null}">
                                <label
                                        for="authenticatedOrcid"
                                        class="col-sm-3 form-label"
                                        aria-describedby="orcidHelpText">
                                    #{bundle['user.orcid']}
                                    <span id="orcidHelpText" class="visually-hidden">
                                        ORCID
                                    </span>
                                    <span class="bi bi-question-circle tooltip-icon"
                                          aria-hidden="true"
                                          data-bs-toggle="tooltip" data-bs-placement="right" title="ORCID"></span>
                                </label>
                                <div class="col-sm-4" id="authenticatedOrcid">
                                    <p class="form-control-static">
                                        <o:importFunctions type="edu.harvard.iq.dataverse.authorization.providers.oauth2.impl.OrcidOAuth2AP" />
                                        <h:graphicImage value="#{OrcidOAuth2AP:getLogo()}" height="16" width="16" alt="#{of:format1(bundle['alt.logo'], bundle['user.orcid'])}"/>&#160;
                                        <h:outputLink value="#{OAuth2FirstLoginPage.newUser.displayInfo.orcid}" title="#{bundle['user.orcid.link']}" target="_blank">
                                            <h:outputText value="#{OAuth2FirstLoginPage.newUser.displayInfo.orcidForDisplay}"/>
                                        </h:outputLink>
                                    </p>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label
                                        for="affiliation"
                                        class="col-sm-3 form-label"
                                        aria-describedby="affiliationHelpText">
                                    #{bundle['affiliation']} 
                                    <span class="bi bi-asterisk text-danger" title="#{bundle.requiredField}"/>
                                    <span id="affiliationHelpText" class="visually-hidden">
                                        #{bundle['user.affiliation.tip']}
                                    </span>
                                    <span class="bi bi-question-circle tooltip-icon"
                                          aria-hidden="true"
                                          data-bs-toggle="tooltip" data-bs-placement="right" title="#{bundle['user.affiliation.tip']}"></span>
                                </label>
                                <div class="col-sm-4">
                                    <p:inputText id="affiliation" styleClass="form-control" value="#{OAuth2FirstLoginPage.newUser.displayInfo.affiliation}"/>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label
                                        for="position"
                                        class="col-sm-3 form-label"
                                        aria-describedby="positionHelpText">
                                    #{bundle['user.position']} 
                                    <span class="bi bi-asterisk text-danger" title="#{bundle.requiredField}"/>
                                    <span id="positionHelpText" class="visually-hidden">
                                        #{bundle['user.position.tip']}
                                    </span>
                                    <span class="bi bi-question-circle tooltip-icon"
                                          aria-hidden="true"
                                          data-bs-toggle="tooltip" data-bs-placement="right" title="#{bundle['user.position.tip']}"></span>
                                </label>
                                <div class="col-sm-4">
                                    <p:inputText id="position" styleClass="form-control" value="#{OAuth2FirstLoginPage.newUser.displayInfo.position}"/>
                                </div>
                            </div>
                            <ui:include src="../termsofuse.xhtml"/>
                            <div class="row mb-3">
                                <div class="col-sm-12 button-block">
                                    <p:commandButton id="createNewAccountButton"
                                                     styleClass="btn btn-secondary"
                                                     action="#{OAuth2FirstLoginPage.createNewAccount}"
                                                     ajax="false"
                                                     update="@all"
                                                     value="#{bundle['user.createBtn']}"/>
                                </div>
                            </div>
                        </h:form>
                    </p:tab>
                </p:tabView>
            </ui:define>
        </ui:composition>
    </h:body>
</html>
